# k8s port of compose.mcp.yaml. A Pod already shares one network namespace between its
# containers, which is exactly what `network_mode: service:oauth-proxy` emulated:
#   localhost:8081 = DCR proxy, localhost:8080 = mock server, localhost:3232 = MCP server.
# Keep replicas at 1 (mock server state and MCP sessions are in memory).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-mcp
  namespace: srv-mke-aigateway
  labels: { app: oauth-mcp }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: oauth-mcp }
  template:
    metadata:
      labels: { app: oauth-mcp }
    spec:
      # The MCP server calls <AUTH_SERVER_URL>/introspect, which is the public URL.
      # Resolve it to the MetalLB IP (ingress-nginx) from inside the Pod.
      hostAliases:
        - ip: "1.2.3.4"
          hostnames: ["dev-auth.meditek.inc"]
      containers:
        - name: oauth-proxy
          image: node:22-bookworm-slim
          command: ["node", "/app/server.js"]
          env:
            - { name: PORT, value: "8081" }
            - { name: UPSTREAM, value: "http://localhost:8080" }
          ports:
            - { name: proxy, containerPort: 8081 }
          volumeMounts:
            - { name: proxy-src, mountPath: /app, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 8081 }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }

        - name: mock-oauth2-server
          image: ghcr.io/navikt/mock-oauth2-server:5.0.2
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: LOG_LEVEL, value: INFO }
          readinessProbe:
            tcpSocket: { port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }

        - name: mcp-server
          # Build from mcp/Dockerfile (see k8s/README.md) and push to your registry.
          image: REGISTRY/mcp-example-remote-server:latest
          env:
            - { name: PORT, value: "3232" }
            - { name: BASE_URI, value: "https://dev-auth.meditek.inc:8443" }
            - { name: AUTH_MODE, value: external }
            - { name: AUTH_SERVER_URL, value: "https://dev-auth.meditek.inc:8443/issuer1" }
            - { name: INTROSPECT_CLIENT_ID, value: mcp-server }   # mock accepts any credentials
            - { name: INTROSPECT_CLIENT_SECRET, value: secret }
            - { name: NODE_ENV, value: development }
            # If the TLS cert is signed by a private CA, mount it and uncomment:
            # - { name: NODE_EXTRA_CA_CERTS, value: /etc/ssl/extra/ca.crt }
          ports:
            - { name: mcp, containerPort: 3232 }
          readinessProbe:
            tcpSocket: { port: 3232 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: proxy-src
          configMap:
            name: oauth-proxy-src
