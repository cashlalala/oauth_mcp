# MCP example-remote-server (AUTH_MODE=external) + mock-oauth2-server, with a small
# front proxy that adds Dynamic Client Registration (DCR) to the mock server.
#
# The mock server derives the issuer from the request host, so the browser, the MCP
# client and the MCP server must all reach it as http://localhost:8081. All three
# services therefore share one network namespace (owned by oauth-proxy): inside it,
# localhost:8081 is the DCR proxy, localhost:8080 the mock server, localhost:3232 the
# MCP server. Published ports live on oauth-proxy.
services:
  oauth-proxy:
    image: node:22-bookworm-slim
    command: ["node", "/app/server.js"]
    volumes:
      - ./proxy:/app:ro
    environment:
      PORT: "8081"
      UPSTREAM: http://localhost:8080
    ports:
      - "8081:8081"   # DCR proxy -> mock-oauth2-server (the issuer URL)
      - "3232:3232"   # MCP server

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:5.0.2
    network_mode: "service:oauth-proxy"
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: INFO

  mcp-server:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    network_mode: "service:oauth-proxy"
    depends_on:
      - oauth-proxy
      - mock-oauth2-server
    environment:
      PORT: "3232"
      BASE_URI: http://localhost:3232
      AUTH_MODE: external
      AUTH_SERVER_URL: http://localhost:8081/issuer1
      INTROSPECT_CLIENT_ID: mcp-server       # mock server accepts any client credentials
      INTROSPECT_CLIENT_SECRET: secret
      NODE_ENV: development
